name: Content quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate MDX frontmatter and learning structure
        run: node .github/scripts/validate-content.mjs
